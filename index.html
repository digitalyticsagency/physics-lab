<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhysicsLab — Learn Physics From Zero</title>
<meta name="description" content="Interactive physics course: Year 11 &amp; 12 plus beginner foundations. Simulations, games, quizzes and an AI tutor.">
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚛️</text></svg>">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
  <a class="brand" href="#/">⚛️ Physics<span>Lab</span></a>
  <div class="spacer"></div>
  <a class="progress-pill" id="duePill" href="#/review" title="Cards due for review">🧠 0</a>
  <div class="progress-pill" id="globalProgress" title="Overall progress">0%</div>
  <button class="icon-btn" id="modeBtn" title="Simple / full detail" aria-label="Toggle detail level">🌱</button>
  <button class="icon-btn" id="langBtn" title="বাংলা / English" aria-label="Toggle language">বাং</button>
  <button class="icon-btn" id="aiBtn" title="AI tutor" aria-label="AI tutor">🧠</button>
  <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Course navigation">
    <div class="sidebar-search">
      <input id="searchBox" type="search" placeholder="Search chapters, formulas…" aria-label="Search">
    </div>
    <div id="navTree" class="nav-tree"></div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<aside class="ai-panel" id="aiPanel" aria-label="AI tutor">
  <div class="ai-head">
    <strong id="aiTitle">🧠 AI Tutor</strong>
    <div class="spacer"></div>
    <button class="icon-btn" id="aiSettingsBtn" title="Settings">⚙️</button>
    <button class="icon-btn" id="aiCloseBtn" aria-label="Close">✕</button>
  </div>
  <div class="ai-settings hidden" id="aiSettings">
    <label id="aiKeyLabel">Anthropic API key <small>(stored only in this browser)</small>
      <input type="password" id="aiKey" placeholder="sk-ant-…">
    </label>
    <label id="aiModelLabel">Model
      <select id="aiModel">
        <option value="claude-sonnet-5" id="optSonnet">claude-sonnet-5</option>
        <option value="claude-opus-5" id="optOpus">claude-opus-5</option>
        <option value="claude-haiku-4-5-20251001" id="optHaiku">claude-haiku-4-5</option>
      </select>
    </label>
    <button class="btn" id="aiSaveBtn">Save</button>
    <p class="hint" id="aiHint">No key? The tutor still works in <b>offline coach mode</b> using the built-in explanations for the current chapter.</p>
  </div>
  <div class="ai-chips" id="aiChips"></div>
  <div class="ai-log" id="aiLog"></div>
  <form class="ai-input" id="aiForm">
    <input id="aiText" placeholder="Ask anything about this chapter…" autocomplete="off">
    <button class="btn" type="submit">Ask</button>
  </form>
</aside>

<div class="scrim" id="scrim"></div>

<script src="js/data/physics.js?v=11"></script>
<script src="js/data/i18n.js?v=11"></script>
<script src="js/data/simple.js?v=11"></script>
<script src="js/data/bn-content.js?v=11"></script>
<script src="js/data/bn-quiz.js?v=11"></script>
<script src="js/data/bn-detail.js?v=11"></script>
<script src="js/data/practice-bank.js?v=11"></script>
<script src="js/data/derivations.js?v=11"></script>
<script src="js/data/resources.js?v=11"></script>
<script src="js/graphics.js?v=11"></script>
<script src="js/data/quiz.js?v=11"></script>
<script src="js/sims.js?v=11"></script>
<script src="js/games.js?v=11"></script>
<script src="js/twin.js?v=11"></script>
<script src="js/practice.js?v=11"></script>
<script src="js/derive.js?v=11"></script>
<script src="js/memory.js?v=11"></script>
<script src="js/ai.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
